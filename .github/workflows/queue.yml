# Processes the triage queue every 5 minutes by calling the protected endpoint on the deployed app.
# Needs two repository secrets: APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET (same value as on Vercel).
name: Process queue
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: queue
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the queue endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/queue"
